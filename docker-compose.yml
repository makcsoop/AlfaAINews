name: alfa-ai-news

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-newsai}:${POSTGRES_PASSWORD:-newsai}@db:5432/${POSTGRES_DB:-newsai}
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./data:/app/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newsai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newsai}
      POSTGRES_DB: ${POSTGRES_DB:-newsai}
    ports:
      # только локально и не 5432: на машине может стоять свой PostgreSQL
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-newsai} -d ${POSTGRES_DB:-newsai}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  # Однократно: таблицы, расширение vector, CSV кейса и фикстура «ставка 14%»
  init:
    <<: *app
    command: ["python", "-m", "backend.db.init", "--load-case", "--load-fixtures"]
    restart: "no"

  backend:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-newsai}:${POSTGRES_PASSWORD:-newsai}@db:5432/${POSTGRES_DB:-newsai}
      REDIS_URL: redis://redis:6379/0
      # /labeling показывает профили компаний без сессии — на демо выключен; для разметки: LABELING_ENABLED=true
      LABELING_ENABLED: ${LABELING_ENABLED:-false}
      # демо-стенд по умолчанию: живая лента из БД Р1, конвейер карточек, кеш в Redis (переживает перезапуск);
      # любое значение переопределяется в .env (например, LLM_MODE=fixture — без ключа и без ₽)
      LLM_MODE: ${LLM_MODE:-live}
      TOOL_SOURCE: ${TOOL_SOURCE:-db}
      CARD_STORE: ${CARD_STORE:-pipeline}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      # порог ленты и число глубоких разборов — в config/scoring.yaml (feed); FEED_* в .env только переопределяют
      CRITIC_LLM_ENABLED: ${CRITIC_LLM_ENABLED:-true}
      # подпись сессий: без секрета стенд не поднимется (в git не хранить; openssl rand -hex 32)
      SESSION_SECRET: ${SESSION_SECRET:?задайте SESSION_SECRET в .env — openssl rand -hex 32}
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  ingest:
    <<: *app
    command: ["python", "-m", "backend.ingest.run"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-newsai}:${POSTGRES_PASSWORD:-newsai}@db:5432/${POSTGRES_DB:-newsai}
      REDIS_URL: redis://redis:6379/0
      # true — подтверждённые сюжеты типирует модель (шаг extract общего клиента, до 60 вызовов за проход);
      # нужен ключ LLM_API_KEY в .env; модель воркер зовёт только при EXTRACT_LLM=true
      EXTRACT_LLM: ${EXTRACT_LLM:-false}
      LLM_MODE: live
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
