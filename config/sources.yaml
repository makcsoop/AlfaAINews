# Реестр источников. Правка источника = правка этого файла, код не трогаем.
# tier: 0 — регулятор/первоисточник, 1 — информагентства, 2 — деловые СМИ/биржи/аналитика, 3 — агрегаторы/авторские
# weight: стартовый вес достоверности (ручной), дальше уточняется подтверждениями/опровержениями
# value: ценность для бизнеса 1–5 из sources.md
# full_text: feed — полный текст в ленте; fetch — скачиваем статью (trafilatura); none — только заголовок и лид
# is_partial: пейволл — храним только заголовок и лид, страницу не качаем
# official: одного такого источника достаточно для статуса «подтверждено»

defaults:
  poll_seconds: 180
  host_rps: 1.0

sources:
  # ---------- RSS: день 1 ----------
  - {id: prime, name: "ПРАЙМ", kind: rss, url: "https://1prime.ru/export/rss2/index.xml",
     tier: 1, weight: 0.85, value: 4, poll_seconds: 120, full_text: fetch,
     tags: [agency, fx, commodities], audience: "Казначейство, ВЭД, сырьевые компании"}
  - {id: interfax, name: "Интерфакс", kind: rss, url: "https://www.interfax.ru/rss.asp",
     tier: 1, weight: 0.9, value: 5, poll_seconds: 120, full_text: fetch,
     tags: [agency], audience: "Все отрасли; основной источник подтверждения фактов"}
  - {id: rbc, name: "РБК", kind: rss, url: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss",
     tier: 2, weight: 0.8, value: 4, poll_seconds: 180, full_text: feed,
     tags: [business_media], audience: "Все"}

  # ---------- RSS: день 2 ----------
  - {id: tass, name: "ТАСС", kind: rss, url: "https://tass.ru/rss/v2.xml",
     tier: 1, weight: 0.85, value: 4, full_text: none,
     tags: [agency], audience: "ВЭД, госсектор"}  # страницы статей отдают 403 боту — берём лид из ленты
  - {id: kommersant, name: "Коммерсантъ", kind: rss, url: "https://www.kommersant.ru/RSS/news.xml",
     tier: 2, weight: 0.8, value: 4, full_text: none, is_partial: true,
     tags: [business_media], audience: "Отраслевые эксклюзивы"}
  - {id: vedomosti, name: "Ведомости", kind: rss, url: "https://www.vedomosti.ru/rss/news",
     tier: 2, weight: 0.8, value: 4, full_text: none, is_partial: true,
     tags: [business_media], audience: "Отраслевые рубрики"}
  - {id: cbr_press, name: "ЦБ — пресс-релизы", kind: rss, url: "http://www.cbr.ru/rss/RssPress",
     tier: 0, weight: 1.0, value: 5, poll_seconds: 300, full_text: fetch, official: true,
     tags: [regulator, rate], audience: "Заёмщики, казначейство, ВЭД"}
  - {id: cbr_events, name: "ЦБ — новости и выступления", kind: rss, url: "http://www.cbr.ru/rss/eventrss",
     tier: 0, weight: 1.0, value: 4, poll_seconds: 600, full_text: fetch, official: true,
     tags: [regulator], audience: "Казначейство, финдиректора"}
  - {id: agroinvestor, name: "Агроинвестор", kind: rss, url: "https://www.agroinvestor.ru/rss/",
     tier: 2, weight: 0.7, value: 3, poll_seconds: 600, full_text: fetch, enabled: false,
