  - {id: cbr_press, publisher: cbr, name: "ЦБ — пресс-релизы", kind: rss, url: "http://www.cbr.ru/rss/RssPress",
     tier: 0, weight: 1.0, value: 5, poll_seconds: 300, full_text: fetch, official: true,
     tags: [regulator, rate], audience: "Заёмщики, казначейство, ВЭД"}
  - {id: cbr_events, publisher: cbr, name: "ЦБ — новости и выступления", kind: rss, url: "http://www.cbr.ru/rss/eventrss",
