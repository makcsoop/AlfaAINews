     tier: 1, weight: 0.85, value: 4, full_text: none,
     tags: [agency], audience: "ВЭД, госсектор"}  # страницы статей отдают 403 боту — берём лид из ленты
  - {id: kommersant, publisher: kommersant, name: "Коммерсантъ", kind: rss, url: "https://www.kommersant.ru/RSS/news.xml",
     tier: 2, weight: 0.8, value: 4, full_text: none, is_partial: true,
     tags: [business_media], audience: "Отраслевые эксклюзивы"}
  - {id: vedomosti, publisher: vedomosti, name: "Ведомости", kind: rss, url: "https://www.vedomosti.ru/rss/news",
     tier: 2, weight: 0.8, value: 4, full_text: none, is_partial: true,
