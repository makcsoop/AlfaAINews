# Реестр источников. Правка источника = правка этого файла, код не трогаем.
# tier: 0 — регулятор/первоисточник, 1 — информагентства, 2 — деловые СМИ/биржи/аналитика, 3 — агрегаторы/авторские
# weight: стартовый вес достоверности (ручной), дальше уточняется подтверждениями/опровержениями
# value: ценность для бизнеса 1–5 из sources.md
# full_text: feed — полный текст в ленте; fetch — скачиваем статью (trafilatura); none — только заголовок и лид
# is_partial: пейволл — храним только заголовок и лид, страницу не качаем
# official: одного такого источника достаточно для статуса «подтверждено»
# publisher: издатель — разные ленты одного издателя (сайт и Telegram, пресс-релизы и события ЦБ) считаются
#   одним независимым источником; по умолчанию издатель = id

defaults:
  poll_seconds: 180
  host_rps: 1.0

sources:
  # ---------- RSS: день 1 ----------
  - {id: prime, publisher: prime, name: "ПРАЙМ", kind: rss, url: "https://1prime.ru/export/rss2/index.xml",
     tier: 1, weight: 0.85, value: 4, poll_seconds: 120, full_text: fetch,
     tags: [agency, fx, commodities], audience: "Казначейство, ВЭД, сырьевые компании"}
  - {id: interfax, publisher: interfax, name: "Интерфакс", kind: rss, url: "https://www.interfax.ru/rss.asp",
     tier: 1, weight: 0.9, value: 5, poll_seconds: 120, full_text: fetch,
     tags: [agency], audience: "Все отрасли; основной источник подтверждения фактов"}
  - {id: rbc, publisher: rbc, name: "РБК", kind: rss, url: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss",
     tier: 2, weight: 0.8, value: 4, poll_seconds: 180, full_text: feed,
     tags: [business_media], audience: "Все"}

  # ---------- RSS: день 2 ----------
