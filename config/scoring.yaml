# Скоринг v0 и профиль v1: все веса и пороги — здесь, не в коде (backend/profile, backend/ranking).
# score = quality × freshness × (1 − exp(−raw / saturation)),
# raw = Σ вкладов каналов × channels + прямые совпадения × direct + сюрприз × surprise.

version: v0

# ---------- профиль: откуда берётся чувствительность клиента к фактору ----------
profile:
  sector_weight: 1.0              # строка ОКВЭД из channels_matrix.yaml
  # общее для всех компаний: налоги платит любая, предположение без признака в CSV
  baseline: {tax_burden: -0.5}
  # продукт в банке → чувствительность к фактору (что получает клиент при росте фактора)
  products:
    loans:      {key_rate: -0.8, credit_conditions: -0.5}
    leasing:    {key_rate: -0.5}
    factoring:  {key_rate: -0.3, counterparty_defaults: -0.4}
    deposits:   {key_rate: 0.7}
    payroll:    {labor_costs: -0.3}
    guarantees: {public_spending: 0.3}
  # ВЭД: общая часть для всех и часть по направлению; направление — предположение по отрасли
  fea:
    any:      {trade_restrictions: -0.6, logistics_costs: -0.5, capital_controls: -0.4}
    exporter: {fx_rub: -0.6, export_demand: 0.4}
    importer: {fx_rub: 0.6, import_prices: -0.4}
  exporter_sectors: ["01", "02", "03", "05", "06", "07", "08", "16", "17", "19", "20", "24"]
  importer_sectors: ["21", "26", "27", "28", "29", "45", "46", "47", "86"]
  # контрагенты из графа платежей: клиент наследует часть чувствительности их отрасли
  counterparty_weight: 0.5        # доля в платежах × вес × строка матрицы отрасли контрагента
  counterparty_min_share: 0.15    # мельче — не учитываем
  hhi_high: 0.25                  # выше — высокая зависимость, неплатежи контрагентов бьют сильнее
  hhi_defaults: -0.3

# ---------- качество сюжета (если Р1 не посчитал story.quality) ----------
quality:
  tier_weight: {0: 0.95, 1: 0.85, 2: 0.7, 3: 0.5}
  corroboration_step: 0.04        # за каждый независимый источник сверх первого
  corroboration_cap: 0.12
  status: {confirmed: 1.0, single: 0.85, unconfirmed: 0.75, rumor: 0.55, contradictory: 0.5}
  rumor: 0.7                      # факты помечены как слух
  intent: 0.85                    # «планирует» — намерение, а не решение
  default: 0.6                    # источник неизвестен

freshness:
  half_life_hours: 48
  floor: 0.15

# ---------- вклады ----------
weights:
  channels: 1.0
  direct: 1.0
  surprise: 0.6

direct:
  company: 1.0                    # компания клиента названа в событии
  group: 0.7                      # компания его группы
  counterparty: 0.6               # ключевой контрагент назван (× доля в платежах)
  sector: 0.35                    # отрасль клиента названа в событии
  counterparty_sector: 0.6        # отрасль покупателей / поставщиков названа (× доля)
  linked_sector: 0.5              # связанная отрасль (sector_links) названа (× вес связи)
  region: 0.15

surprise:
  # отклонение факта от ожиданий, при котором сюрприз считается полным
  full_at: {"%": 0.5, "п.п.": 0.5, "руб": 5.0, "б.п.": 50}
  default_full_at: 0.1            # в долях от ожидания, если единица неизвестна
  # какое число события сравнивать с ожиданиями: тип события → метрика.
  # number_hint — слово в period или цитате числа из фактов; forecast_prefix — Forecast.metric позиции ЦМИ
  metrics:
    # hold_prefix — прогноз «без изменений до конца года» с направлением 0 тоже считается ожиданием к заседанию
    rate_decision:  {metric: "ключевая ставка", unit: "%", number_hint: "ставк", forecast_prefix: "key_rate_decision",
                     hold_prefix: "key_rate_eoy"}
    inflation_data: {metric: "инфляция", unit: "%", number_hint: "инфляц", forecast_prefix: "cpi"}
    fx_move:        {metric: "курс доллара", unit: "руб", number_hint: "доллар", forecast_prefix: "usdrub"}

# ---------- акценты ролей: множитель вклада канала ----------
# финдиректору важнее долг и ставка, казначею — курс и ликвидность, главбуху — налоги и отчётность
roles:
  cfo:
    focus: {key_rate: 1.5, credit_conditions: 1.5, subsidized_lending: 1.3, counterparty_defaults: 1.3}
    other: 0.85
  treasurer:
    focus: {fx_rub: 1.5, key_rate: 1.3, capital_controls: 1.4, equity_market: 1.2, export_demand: 1.2}
    other: 0.85
  chief_accountant:
    focus: {tax_burden: 2.0, regulation: 1.5, capital_controls: 1.3, labor_costs: 1.2}
    other: 0.6

# ---------- уверенность уровнями с причинами ----------
# баллы: источники, согласие аналитиков, проверенные утверждения, поддержка банка и рынка, прямая связь
confidence:
  high_from: 4                     # баллов для «высокая»
  medium_from: 2
  verified_good: 0.9               # доля проверенных утверждений: выше — плюс балл
  verified_bad: 0.7                # ниже — минус балл
  corroboration_good: 2            # независимых источников для балла без первоисточника

# событие названо про конкретные отрасли (sectors_okved), а клиент не из них и с ними не связан
# (ни отраслью-соседом, ни контрагентами) — вклады каналов ослабляются: пошлина на зерно не про металлурга
off_sector: 0.3
# воздействие известно только из приора типа события (экстрактор не дал направления), а отраслей событие
# не называет — тип мог быть угадан по слову («санкции» в политической новости): вклады каналов ослабляются
prior_unscoped: 0.5
# только для типов, которые обычно касаются отдельных отраслей и стран; налоги и МРОТ — общие для всех
prior_unscoped_types: [sanctions, secondary_sanctions, sanctions_relief, tariff_duty, export_duty, import_duty, export_ban_quota, supply_disruption]

saturation: 1.2                  # raw = 1,2 → score ≈ 0,63 × quality × freshness
min_contribution: 0.02            # мельче — не показываем во вкладах

polarity:
  dominance: 0.67                 # доля «риска» или «возможности», чтобы назвать карточку так
  neutral_below: 0.05

# ---------- что отправить на глубокий разбор (топ-K «сюжет × отрасль») ----------
deep:
  share_of_budget: 0.45           # доля остатка дневного бюджета на глубокий разбор
  cost_per_pair_rub: 0.75         # ≈ 45 ₽ на 60 пар в день
  k_max: 60
  # ниже — только быстрая карточка. 0,25 подбирался на фикстуре; на живой базе 24.10 значимость ниже:
  # у вкладчика решение ЦБ — 0,21, выше 0,25 не было ни одного сюжета, у заёмщика — два
  min_score: 0.12
  economy_at: 0.7                 # потрачено ≥ 70% лимита — K вдвое меньше, порог выше
  economy_min_score: 0.3
  stop_at: 0.9                    # ≥ 90% — только быстрые карточки

# уровень ставки: решение ЦБ «без изменений» (аналитики и правила дают key_rate flat) при высокой ставке — не ноль:
# заёмщику дорогой долг дольше, вкладчику — доходность размещения. Сила = (ставка − neutral) / full_at × strength
rate_level:
  types: [rate_decision, monetary_signal]
  neutral: 8.0                    # %, около нейтральной ставки
  full_at: 8.0                    # на столько п.п. выше нейтральной — полная сила
  strength: 0.5                   # сила при полной высоте ставки (как «средний» сдвиг фактора)
  # заявления и анонсы с упоминанием ставки — не само решение: с полной силой анонс заседания стоял 3-м,
  # рядом с решением, и выглядел дублем
  strength_by_type: {monetary_signal: 0.2}

# ---------- лента (читает API Р3; раньше — переменные окружения FEED_MIN_SCORE, FEED_DEEP_PER_REQUEST) ----------
feed:
  min_score: 0.05                 # ниже — карточка в ленту не попадает
  deep_per_request: 1             # глубоких разборов за один запрос ленты (живые модели отвечают долго)
  # отклик пользователя: только явные «полезно / не про нас», вес 0,3 (клики по источникам — только в метрики)
  feedback_weight: 0.3
  feedback_cap: 0.6               # сильнее не понижаем и не повышаем, сколько бы отметок ни было
