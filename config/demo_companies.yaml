# Витрина демо-входа: компании, которые можно выбрать в интерфейсе (GET /demo/companies, POST /session).
# Вход в любую другую компанию — 403 и запись в журнал безопасности. DEMO_COMPANIES в окружении
# полностью заменяет этот список (для стенда и тестов).
#
# Здесь только витринные поля: id, понятное название, ОКВЭД с расшифровкой, регион, флаги продуктов.
# Сумм платежей, контрагентов, связей через физлиц, точной выручки и отметок о негативе здесь нет и быть
# не должно — это проверяет tests/test_demo_companies.py.
#
# kind: case — реальная компания из CSV кейса (профиль строится из данных, лента — из базы новостей,
#       TOOL_SOURCE=db); demo — архетип фикстуры rate_14 (работает и без базы).
# Подбор: 6 компаний разметки eval (data/labeling/labels-oct-60.csv) — разные отрасли и продукты,
# полнота профиля 1.0 — и U_57706 (крупный топливный оптовик с депозитами).
# archetype — ближайший архетип из config/archetypes.yaml (для подписи и роли по умолчанию).

companies:
  - company_id: U_DEMO_BORROWER
    kind: demo
    title: Оптовик с кредитами и ВЭД
    description: демо-архетип · ставка и курс юаня
    archetype: wholesale_borrower
    default_role: cfo
    okved_code: "46.69"
    okved_name: Торговля оптовая прочими машинами и оборудованием
    region: Москва
    fea_countries: [Китай]
    products: {loans: true, leasing: true, deposits: false, guarantees: false, factoring: false, fea: true}

