# Отсев до склейки: материал остаётся в raw_items, в dropped_reason пишется причина (журнал отсева).
# where: title — заголовок; body — заголовок + лид + текст; tags — рубрики источника (точное совпадение).
# sources: правило действует только для этих источников (по умолчанию — для всех).
# Регулярки без учёта регистра.

rules:
  - reason: ad
    where: body
    pattern: '\berid\b|erid:|на правах рекламы|#реклама|#промо|#ad\b|партн[её]рский материал|реклама\.\s*\d+\+'

  - reason: digest
    where: title
    pattern: '^(что произошло за (день|неделю|сутки)|главное (на|за|к|в)\b|главные новости|дайджест|итоги (дня|недели)\b|новости дня|(утренний|вечерний) брифинг|самое важное за)'

  - reason: cbr_service
    sources: [cbr_press, cbr_events]
    where: title
    pattern: 'монет[аы]\b|памятн|приглаша|финансов\w* грамотност|чемпионат|конкурс|олимпиад|вебинар|аннулирует новость|расписани|график (проведения|публикаци)'

  - reason: not_news
    where: tags
    pattern: '^(Радио|Подкаст|Подкасты|Видео|Тесты|Спецпроект|Партнерский материал)$'
