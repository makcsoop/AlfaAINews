# Типы событий и факторы, которые они двигают. 40 типов: первые 25 — стартовые, остальные — расширение.
# Принятое и предлагаемое регулирование — разные типы (правило GDELT).
#
# channels — факторы, которые разбор обязан оценить (читают планировщик, аналитики, критик).        Р2
# prior — направление и сила фактора по умолчанию, −1…1 (+ фактор растёт, − падает): быстрый скоринг
#   берёт его, пока экстрактор не дал направление из текста. Нет prior — направление зависит от
#   события (ставку могут и поднять, и снизить), без фактов канал в быстрый скор не идёт.            Р2
# patterns — регулярки предварительного типирования (без учёта регистра) по заголовку и лиду.       Р1
#   Порядок важен: побеждает первый тип, у которого сработал паттерн. Тип от LLM сверяется с этой
#   разметкой, а при исчерпании бюджета она остаётся единственной.
# direction_hints — подсказки направления фактора для правил: слово рядом с ключом фактора.          Р1

event_types:
  rate_decision:
    channels: ["key_rate", "fx_rub", "inflation"]
    patterns: ['(сохранил|повысил|снизил|оставил)\w* ключев\w+ ставк', 'ключев\w+ ставк\w* (сохран|повыш|сниж|остав)', 'решени\w+ по ключевой ставке']
  monetary_signal:
    channels: ["key_rate"]
    patterns: ['денежно-кредитн', '\bДКП\b', 'Набиуллин', 'жестк\w+ (политик|риторик)', 'процентн\w+ ставк\w* (по|кредитн)', 'максимальн\w+ процентн\w+ ставок', 'ставк\w+ по (вклад|депозит|кредит|ипотек)']
  inflation_data:
    channels: ["inflation", "key_rate", "consumer_demand"]
    patterns: ['\bинфляци', 'рост цен', 'дефляци', 'инфляционн\w+ ожидани']
  fx_control:
    channels: ["fx_rub", "logistics_costs", "capital_controls"]
    prior: {"capital_controls": 0.6}
    patterns: ['валютн\w+ контрол', 'репатриаци', 'обязательн\w+ продаж\w+ (валют|выручк)']
  fx_move:
    channels: ["fx_rub"]
    patterns: ['курс\w* (доллар|евро|юан|рубл)', '(доллар|евро|юань|рубль)\w* (подорожал|подешевел|укрепил|ослаб|вырос|упал)', 'официальн\w+ курс', '(покупк|продаж)\w* (юан|валют)\w*.{0,40}(ЦБ|Минфин|бюджетн)', '(ЦБ|Минфин)\w*.{0,40}(покупк|продаж)\w* (юан|валют)']
  # Санкции — только мера (ввели / расширили / продлили / сняли, пакет, SDN), а не слово «санкции»:
  # заявления политиков и переговоры без меры остаются other. «Не ввели» отсекает код (rules.NEGATABLE).
  sanctions_relief:
    channels: ["trade_restrictions", "logistics_costs"]
    prior: {"trade_restrictions": -0.6, "logistics_costs": -0.4}
    patterns: ['\b(снял|сняли|сняло|снимает|снимают|отменил|отменили|отменяет|ослабил|ослабили|смягчил|смягчили|исключил|исключили|исключен|исключён|исключена)\b\s(\S+\s){0,6}?(санкци|SDN)', 'санкци\w*\s(\S+\s){0,4}?(сняты|снят|отменены|отменен|ослаблены|приостановлен\w*)\b', '\b(вывел|вывели|выведен\w*)\s(\S+\s){0,4}?из-под санкци']
  secondary_sanctions:
    channels: ["trade_restrictions", "logistics_costs", "capital_controls"]
    prior: {"trade_restrictions": 0.8, "logistics_costs": 0.7, "capital_controls": 0.4}
    patterns: ['\b(ввел|ввёл|ввели|ввело|вводит|вводят|введут|наложил|наложили|применил|применили)\b\s(\S+\s){0,4}?вторичн\w+ санкци', 'вторичн\w+ санкци\w*\s(\S+\s){0,4}?(введен\w*|введён\w*|наложен\w*)\b']
  sanctions:
    channels: ["trade_restrictions", "logistics_costs", "fx_rub"]
    prior: {"trade_restrictions": 0.8, "logistics_costs": 0.5, "counterparty_defaults": 0.3}
    patterns: ['\b(ввел|ввёл|ввели|ввело|вводит|вводят|введут|расширил|расширили|расширяет|расширят|продлил|продлили|продлевает|продлит|продлят|утвердил|утвердили|одобрил|одобрили|наложил|наложили|включил|включили|внес|внёс|внесли|принял|приняли)\b\s(\S+\s){0,6}?(санкци|ограничительн\w+ мер|в санкционн\w+ спис|в черн\w+ спис|в SDN)', 'санкци\w*\s(\S+\s){0,4}?(введен\w*|введён\w*|вступ\w* в силу|вступил\w*|расширен\w*|продлен\w*|продлён\w*|утвержден\w*|утверждён\w*|одобрен\w*)\b', '\bSDN\b', '\bOFAC\b', '\bпопал\w* под (санкци|ограничени)', '\bпод (санкци|ограничени)\w* (попал|попали|попадут|попадает)']
  tariff_duty:
    channels: ["trade_restrictions"]
    prior: {"trade_restrictions": 0.6}
    patterns: ['пошлин', 'тариф\w* на (импорт|экспорт|ввоз|вывоз)', 'квот\w+ на (экспорт|импорт)', 'запрет\w* на (экспорт|ввоз|вывоз)', 'ограничени\w+ на (импорт|ввоз|экспорт|вывоз)', 'таможенн\w+ (процедур|пошлин|оформлен)']
  tax_change_proposed:
    channels: ["tax_burden"]
    prior: {"tax_burden": 0.3}
    patterns: ['(предлож|законопроект|рассматрива|планиру|может)\w*.{0,60}(налог|НДС|НДФЛ|НДПИ|акциз)', '(налог|НДС|НДФЛ|НДПИ|акциз)\w*.{0,60}(предлож|законопроект|рассматрива|планиру)']
  tax_change_adopted:
    channels: ["tax_burden"]
    prior: {"tax_burden": 0.6}
    patterns: ['(повысил|снизил|отменил|ввел|утвердил|принял|подписал)\w*.{0,60}(налог|НДС|НДФЛ|НДПИ|акциз)', '(налог|НДС|НДФЛ|НДПИ|акциз)\w*.{0,40}(вырастет|повыс|сниз|отмен)']
  ofz_auction:
    channels: ["key_rate"]
    patterns: ['\bОФЗ\b', 'аукцион\w* (Минфин|облигаци)', 'доходност\w+ (гособлигац|облигац|ОФЗ|казначейск)']
  budget_policy:
    channels: ["tax_burden", "public_spending"]
    patterns: ['федеральн\w+ бюджет', 'дефицит\w* бюджет', 'бюджетн\w+ правил', 'проект\w* бюджета']
  energy_policy:
    channels: ["oil_gas"]
    patterns: ['демпфер', '(экспорт|вывоз)\w* (бензин|дизел|топлив|нефтепродукт)', 'ОПЕК', 'газопровод', 'поставк\w+ (газа|нефти|СПГ)', 'Сила (Сибири|Байкала)', '(поставил|экспортировал)\w*.{0,40}(газа|нефти)']
  commodity_price:
    channels: ["oil_gas", "metals", "agro", "gold"]
    patterns: ['цен\w* на (нефть|газ|золото|сталь|металл|пшениц|зерно|уголь|удобрени|дизел|бензин)', '(Brent|Urals|WTI)', '(нефть|золото|газ|пшеница)\w* (подорожал|подешевел|вырос|упал)']
  macro_data:
    channels: ["consumer_demand", "labor_costs"]
    patterns: ['\bВВП\b', 'безработиц', 'промпроизводств', 'промышленн\w+ производств', 'оборот\w* розничн', 'реальн\w+ (зарплат|доход)']
  labor_policy:
    channels: ["labor_costs"]
    patterns: ['\bМРОТ\b', 'минимальн\w+ размер\w* оплаты', 'мигрант', 'рынок труда', 'дефицит\w* кадр']
  state_support:
    channels: ["public_spending"]
    prior: {"public_spending": 0.6}
    patterns: ['субсиди', 'господдержк', 'льготн\w+ (кредит|ипотек|ставк)', 'мер\w* поддержки']
  public_procurement:
    channels: ["public_spending"]
    prior: {"public_spending": 0.5}
    patterns: ['госзаказ', 'госконтракт', 'госзакуп', '44-ФЗ', '223-ФЗ']
  regulation_proposed:
    channels: ["regulation"]
    prior: {"regulation": 0.25}
    patterns: ['законопроект', '(предлож|разработа|планиру|рассматрива)\w*.{0,40}(закон|правил|требовани|регулирован)', 'в первом чтении', 'проект\w* постановлени', '(предложил|предлагает|предлагают)\w* (разрешить|запретить|ввести|обязать|упростить|отменить|изменить)', 'призвал\w* (упростить|изменить|ввести|отменить)']
  regulation_adopted:
    channels: ["regulation"]
    prior: {"regulation": 0.5}
    patterns: ['(подписал|принял|утвердил|вступ)\w*.{0,40}(закон|постановлени|приказ|правил)', 'закон вступает в силу', 'вступит в силу', 'тарифн\w+ коридор']
  default_bankruptcy:
    channels: []
    prior: {"counterparty_defaults": 0.6}
    patterns: ['банкротств', '\bдефолт', 'неплатежеспособн', '(ликвидаци|ликвидир)\w*\s(\S+\s){0,2}?(компани|юрлиц|юридическ|банк|организаци|ООО|АО|ПАО|завод|предприяти|застройщик|фонд)', '\bотозвал\w* лицензи|\bотзыв\w* лицензи']
  rating_action:
    channels: []
    patterns: ['кредитн\w+ рейтинг', '(АКРА|Эксперт РА|НКР|НРА|Moody|Fitch|S&P)\b.{0,60}рейтинг', 'рейтинг\w*.{0,30}(повысил|понизил|подтвердил|отозвал)']
  m_and_a:
    channels: []
    patterns: ['(покупк|приобрет|продаж)\w* (дол[иею]|акци|компани|актив)', 'слияни', 'поглощени', '\bIPO\b', '\bSPO\b']
  corporate_results:
    channels: []
    patterns: ['чист\w+ прибыл', '\bвыручк', '\bEBITDA\b', '\bМСФО\b', '\bРСБУ\b', 'финансов\w+ результат', 'дивиденд', '(продаж|выпуск|производств)\w*.{0,40}(снизи|сократ|упа|выр)\w*.{0,20}\d+\s*%']
  supply_disruption:
    channels: ["logistics_costs"]
    prior: {"logistics_costs": 0.6}
    patterns: ['перебо\w+ (поставк|с поставк)', 'дефицит\w* (топлив|бензин|дизел|товар|сырь)', 'остановк\w+ (завод|производств|погрузк)', 'простой\w* (судов|вагон)', '(тариф|ставк)\w* (на|за) (перевоз|фрахт|доставк)', '\bфрахт']
  other:
    channels: []

  # ---------- расширение до 40 (паттернов пока нет: тип ставит LLM-экстрактор) ----------
  export_duty:
    channels: ["trade_restrictions", "fx_rub"]
    prior: {"trade_restrictions": 0.7, "tax_burden": 0.4}
  import_duty:
    channels: ["trade_restrictions", "import_prices"]
    prior: {"trade_restrictions": 0.6, "import_prices": 0.6}
  export_ban_quota:
    channels: ["trade_restrictions", "agro", "petroleum_products"]
    prior: {"trade_restrictions": 0.8}
  capital_control_change:
    channels: ["capital_controls", "fx_rub"]
  credit_regulation:
    channels: ["credit_conditions", "key_rate"]
    prior: {"credit_conditions": 0.5}
  subsidized_lending_program:
    channels: ["subsidized_lending", "public_spending"]
    prior: {"subsidized_lending": 0.6, "public_spending": 0.3}
  mortgage_program:
    channels: ["construction", "real_estate", "subsidized_lending"]
  tariff_indexation:
    channels: ["electricity_tariffs", "rail_tariffs", "inflation"]
    prior: {"inflation": 0.2}
  fuel_damper:
    channels: ["petroleum_products", "oil_gas", "tax_burden"]
  minimum_wage:
    channels: ["labor_costs"]
    prior: {"labor_costs": 0.5}
  windfall_tax:
    channels: ["tax_burden"]
    prior: {"tax_burden": 0.8}
    patterns: ['налог\w* на (сверхдоход|сверхприбыл|непредвиденн\w+ (доход|прибыл))', '\bсверхприбыл', '\bwindfall']
  foreign_demand_data:
    channels: ["export_demand"]
  equity_market_move:
    channels: ["equity_market"]

direction_hints:
  key_rate:
    key: ключев\w+ ставк
    up: повысил|повышен|увелич|подня
    down: снизил|снижен|понизил|уменьш
    flat: сохранил|оставил|сохранен|без изменени|пауз
  fx_rub:
    key: \bрубл\w*
    up: укрепил|укреплен|подорожал
    down: ослаб|подешевел|девальвац
  oil_gas:
    key: \bнефт\w*|\bBrent\b|\bUrals\b|\bгаз\b|\bдизел\w*|\bбензин\w*|\bтоплив\w*
    up: подорожал|вырос|повысил|подскочил
    down: подешевел|упал|снизил|обвал
  gold:
    key: \bзолот\w*
    up: подорожал|вырос|рекорд
    down: подешевел|упал|снизил
  inflation:
    key: \bинфляци\w*|\bрост цен
    up: ускорил|выросл|повысил
    down: замедлил|снизил|дефляци
