# Каналы влияния (факторы) и матрица «ОКВЭД → чувствительность к каналам».
# 30 факторов: первые 15 — стартовые (на их id завязан код разбора), остальные 15 — расширение.
#
# Канал = фактор с направлением (У17): событие двигает фактор вверх или вниз, а «хорошо / плохо»
# для клиента получается только умножением на его чувствительность к фактору:
# ставка ↑ × кредит (−) = риск, ставка ↑ × депозиты (+) = возможность. up — что означает рост фактора.

channels:
  key_rate:           {name: "Ключевая ставка и стоимость денег", up: "кредиты дороже, депозиты доходнее"}
  fx_rub:             {name: "Курс рубля", up: "рубль крепче: импорт дешевле, валютная выручка в рублях меньше"}
  oil_gas:            {name: "Цены на нефть и газ", up: "нефть и газ дороже"}
  metals:             {name: "Цены на металлы", up: "металлы дороже"}
  agro:               {name: "Цены на агросырьё", up: "зерно и агросырьё дороже"}
  gold:               {name: "Цена золота", up: "золото дороже"}
  inflation:          {name: "Инфляция", up: "цены и издержки растут быстрее"}
  consumer_demand:    {name: "Потребительский спрос", up: "спрос растёт"}
  labor_costs:        {name: "Рынок труда и зарплаты", up: "зарплаты и дефицит кадров растут"}
  construction:       {name: "Стройка и ипотека", up: "строительная активность растёт"}
  trade_restrictions: {name: "Пошлины, санкции, ограничения ВЭД", up: "ограничений больше"}
  logistics_costs:    {name: "Логистика и платежи ВЭД", up: "логистика и платежи дороже и дольше"}
  tax_burden:         {name: "Налоговая нагрузка", up: "налоги выше"}
  regulation:         {name: "Отраслевое регулирование", up: "регулирование жёстче"}
  public_spending:    {name: "Госзаказ, бюджет и господдержка", up: "госрасходы и поддержка растут"}
  coal:               {name: "Цены на уголь", up: "уголь дороже"}
  petroleum_products: {name: "Цены на топливо и нефтепродукты", up: "бензин, дизель и мазут дороже"}
  fertilizers_chemicals: {name: "Цены на удобрения и химию", up: "удобрения и химия дороже"}
  timber:             {name: "Цены на лес и древесину", up: "древесина дороже"}
  electricity_tariffs: {name: "Тарифы на электроэнергию и газ для бизнеса", up: "энергия дороже"}
  rail_tariffs:       {name: "Тарифы РЖД и перевозок", up: "перевозка по железной дороге дороже"}
  capital_controls:   {name: "Валютный контроль и продажа выручки", up: "требования жёстче"}
  credit_conditions:  {name: "Условия кредитования и нормативы ЦБ", up: "кредит получить труднее"}
  counterparty_defaults: {name: "Неплатежи и банкротства контрагентов", up: "неплатежей больше"}
  equity_market:      {name: "Фондовый рынок", up: "котировки растут"}
  real_estate:        {name: "Цены и спрос на недвижимость", up: "недвижимость дороже, спрос выше"}
  it_import_substitution: {name: "Импортозамещение ПО и техники", up: "больше требований и поддержки отечественного"}
  export_demand:      {name: "Внешний спрос на российский экспорт", up: "спрос за рубежом выше"}
  subsidized_lending: {name: "Льготные программы кредитования", up: "льготных программ больше"}
  import_prices:      {name: "Цены импорта и параллельного импорта", up: "импортные товары и оборудование дороже"}

# ОКВЭД (2 знака) → чувствительность отрасли к факторам, −1…1: что получает компания отрасли, когда
