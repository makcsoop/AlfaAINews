# Словари для сущностей: синонимы организаций, валюты, сырьё, регуляторы.
# Ключи — канонические имена; значения — регулярки (без учёта регистра) или синонимы.
# Используются в склейке (общая сущность) и в экстракторе фактов.

aliases:  # каноническое имя ← варианты, которые выдаёт Natasha или встречаются в тексте
  Банк России: [ЦБ, ЦБ РФ, Центробанк, Центральный банк, Центральный банк России, Банк России, Центробанк России, ЦБР]
  Минфин России: [Минфин, Министерство финансов, Минфин РФ, Министерство финансов России]
  Минэкономразвития: [МЭР, Минэкономразвития России, Министерство экономического развития]
  Правительство России: [Правительство, Правительство РФ, кабмин, Кабинет министров]
  ФНС: [Федеральная налоговая служба, ФНС России, налоговая служба]
  ФАС: [Федеральная антимонопольная служба, ФАС России]
  ФТС: [Федеральная таможенная служба, ФТС России]
  Росстат: [Федеральная служба государственной статистики]
  Мосбиржа: [Московская биржа, MOEX, Мосбиржи]
  Госдума: [Государственная дума, Дума]
  США: [Соединенные Штаты, Штаты, Соединенные Штаты Америки]
  Россия: [РФ, Российская Федерация]
  Китай: [КНР]
  Евросоюз: [ЕС, Европейский союз]

currencies:
  USD: '\bдоллар\w*|\$|\bUSD\b'
  EUR: '\bевро\b|€|\bEUR\b'
  CNY: '\bюан\w*|\bCNY\b'
  RUB: '\bрубл\w*|\bRUB\b|₽'

commodities:
  нефть: '\bнефт\w*|\bBrent\b|\bUrals\b'
  газ: '\bгаз\b|\bгаза\b|\bгазу\b|\bСПГ\b|природн\w+ газ'
  золото: '\bзолот\w*'
  сталь: '\bстал[ьи]\b|\bметаллопрокат\w*|\bпрокат\w*'
  уголь: '\bугол\w*|\bугл[яею]\b'
  пшеница: '\bпшениц\w*|\bзерн\w*'
  удобрения: '\bудобрени\w*'

# Отрасль события (EventFacts.sectors_okved, 2 знака ОКВЭД) по заголовку и лиду: скоринг Р2 ослабляет
# отраслевое событие для чужих отраслей. Только у отраслевых типов (санкции, пошлины, цены сырья…),
# у макрособытий (ставка, инфляция, курс) отрасль не ставится.
sectors:
  "06": '\bнефтедобыч\w*|\bнефтян\w+ (компани|отрасл|сектор)|\bнефтегаз\w*|\bгазодобыч\w*|\bРоснефт\w*|\bЛукойл\w*|«?Газпром нефт\w*|\bСургутнефтегаз\w*|\bТатнефт\w*|\bНоватэк\w*|\bдобыч\w* (нефти|газа)'
  "19": '\bНПЗ\b|\bнефтепереработ\w*|\bнефтепродукт\w*|\bбензин\w*|\bдизел\w*|\bдизтоплив\w*|\bавиакеросин\w*'
  "05": '\bугол\w*|\bугл[яею]\b|\bугледобы\w*|\bСУЭК\b|\bКузбассразрезугол\w*'
  "07": '\bзолотодобы\w*|\bжелезн\w+ руд\w*|\bалмаз\w*|\bАлроса\b|\bПолюс\w*|\bНорникел\w*|\bНорильск\w+ никел\w*'
  "24": '\bсталь\b|\bстали\b|\bметаллург\w*|\bметаллопрокат\w*|\bСеверстал\w*|\bНЛМК\b|\bММК\b|\bалюмини\w*|\bРусал\w*|\bчугун\w*'
  "20": '\bудобрени\w*|\bФосАгро\b|\bАкрон\w*|\bУралхим\w*|\bУралкали\w*|\bхимическ\w+ (промышлен|отрасл|компани)|\bаммиак\w*'
  "01": '\bпшениц\w*|\bзерн\w*|\bурожа\w*|\bаграри\w*|\bсельхоз\w*|\bАПК\b|\bподсолнечник\w*'
  "41": '\bзастройщик\w*|\bдевелопер\w*|\bжилищн\w+ строительств\w*|\bновостро\w*'
  "29": '\bавтопроизвод\w*|\bавтопром\w*|\bАвтоВАЗ\w*|\bКАМАЗ\w*|\bавтомобил\w+ (рын|завод|производ)'
  "51": '\bавиакомпани\w*|\bАэрофлот\w*|\bавиаперевоз\w*'
  "50": '\bсудоходн\w*|\bморск\w+ (перевоз|порт)|\bтанкер\w*|\bтенево\w+ флот\w*'
  "49": '\bРЖД\b|\bжелезнодорожн\w+ (перевоз|тариф)|\bгрузоперевоз\w*'
  "35": '\bэлектроэнерги\w*|\bэнергосбыт\w*|\bгенерирующ\w+ компани\w*'
  "64": '\bбанк(и|ов|ам|ами)\b|\bбанковск\w+ (сектор|систем)|\bкредитн\w+ организаци\w*'
  "62": '\bIT-компани\w*|\bайти-компани\w*|\bпрограммн\w+ обеспечени\w*|\bразработчик\w* (ПО|софт)'
  "47": '\bритейл\w*|\bрозничн\w+ (сет|торгов)|\bмаркетплейс\w*'

persons:  # ключевые персоны: Natasha их иногда пропускает; ключ склейки — фамилия (per:Трамп)
  Трамп: '\bтрамп(?:а|у|ом|е)?\b'
  Путин: '\bпутин(?:а|у|ым|е)?\b'
  Набиуллина: '\bнабиуллин(?:а|ой|у)\b'
  Силуанов: '\bсилуанов(?:а|у|ым|е)?\b'
  Мишустин: '\bмишустин(?:а|у|ым|е)?\b'

