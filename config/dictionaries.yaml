# Словари для сущностей: синонимы организаций, валюты, сырьё, регуляторы.
# Ключи — канонические имена; значения — регулярки (без учёта регистра) или синонимы.
# Используются в склейке (общая сущность) и в экстракторе фактов.

aliases:  # каноническое имя ← варианты, которые выдаёт Natasha или встречаются в тексте
  Банк России: [ЦБ, ЦБ РФ, Центробанк, Центральный банк, Центральный банк России, Банк России, Центробанк России, ЦБР]
  Минфин России: [Минфин, Министерство финансов, Минфин РФ, Министерство финансов России]
  Минэкономразвития: [МЭР, Минэкономразвития России, Министерство экономического развития]
  Правительство России: [Правительство, Правительство РФ, кабмин, Кабинет министров]
  ФНС: [Федеральная налоговая служба, ФНС России, налоговая служба]
  ФАС: [Федеральная антимонопольная служба, ФАС России]
  ФТС: [Федеральная таможенная служба, ФТС России]
  Росстат: [Федеральная служба государственной статистики]
  Мосбиржа: [Московская биржа, MOEX, Мосбиржи]
  Госдума: [Государственная дума, Дума]
  США: [Соединенные Штаты, Штаты, Соединенные Штаты Америки]
  Россия: [РФ, Российская Федерация]
  Китай: [КНР]
  Евросоюз: [ЕС, Европейский союз]

currencies:
  USD: '\bдоллар\w*|\$|\bUSD\b'
  EUR: '\bевро\b|€|\bEUR\b'
  CNY: '\bюан\w*|\bCNY\b'
  RUB: '\bрубл\w*|\bRUB\b|₽'

commodities:
  нефть: '\bнефт\w*|\bBrent\b|\bUrals\b'
  газ: '\bгаз\b|\bгаза\b|\bгазу\b|\bСПГ\b|природн\w+ газ'
  золото: '\bзолот\w*'
  сталь: '\bстал[ьи]\b|\bметаллопрокат\w*|\bпрокат\w*'
  уголь: '\bугол\w*|\bугл[яею]\b'
  пшеница: '\bпшениц\w*|\bзерн\w*'
  удобрения: '\bудобрени\w*'

regulators:  # подмножество канонических имён, которые считаются регуляторами
  - Банк России
  - Минфин России
  - Минэкономразвития
  - Правительство России
  - ФНС
  - ФАС
  - ФТС
  - Росстат
  - Госдума
