# Заседания Банка России по ключевой ставке: для консенсуса ожиданий и сюрприза «рынок ждал / банк ждал / вышло».
# rate_before — ставка до заседания, %: по ней код считает «пауза / снижение / повышение», если аналитик назвал ставку.
# actual — решение (ставка после, %; change_bp — изменение в б.п.); пусто — решение ещё не объявлено.
# Источник решений — посты ЦБ в Telegram (@centralbank_russia) и пресс-релизы cbr.ru.

meetings:
  - date: 2026-07-24
    rate_before: 14.25                     # 19 июня снижена с 14,5 до 14,25%
    actual: {rate: 14.0, change_bp: -25}   # «снизить ключевую ставку на 25 б.п., до 14% годовых»
  - date: 2026-09-11
    rate_before: 14.0
    actual: {rate: 14.0, change_bp: 0}     # «сохранить ключевую ставку на уровне 14,00% годовых»
  - date: 2026-10-23
    rate_before: 14.0
    actual: null                           # решение в 13:30 МСК; следующее заседание — 18 декабря
