[project]
name = "alfa-ai-news"
version = "0.1.0"
description = "Новостная аналитика для крупного бизнеса: сбор, сюжеты, факты, знания и персонализированные инсайты"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "trafilatura>=2.0",
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "natasha>=1.6.0",
    "scikit-learn>=1.9.1",
    "rapidfuzz>=3.14.6",
    "setuptools<81",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # длинные строки тестовых CSV

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
